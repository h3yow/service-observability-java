spring.application.name=service-observability-java
server.port=8080

# 日志携带关联标识与来源，便于按请求串联
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] %-40.40logger{39} cid=%X{correlationId:-none} src=%X{correlationSource:-none} : %m%n
logging.level.com.github.h3yow.serviceobservabilityjava=INFO
